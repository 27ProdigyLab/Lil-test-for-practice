<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>歌品性张力鉴定</title>
    <link rel="stylesheet" href="./styles.css？v=3" />
  </head>
  <body>
    <main class="app">
      <section class="hero" id="introScreen">
        <div class="brand">歌单审判处</div>
        <h1>歌品性张力鉴定</h1>
        <div class="hero-actions">
          <button class="primary-btn" id="startBtn">开始鉴定</button>
        </div>
      </section>

      <section class="quiz hidden" id="quizScreen" aria-live="polite">
        <header class="quiz-header">
          <button class="ghost-btn" id="backBtn" aria-label="上一题">←</button>
          <div class="progress-wrap">
            <div class="progress-meta">
              <span id="questionIndex">01</span>
              <span id="questionTotal">15</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>
        </header>

        <article class="question-card">
          <p class="question-kicker" id="questionTag">01 / 15</p>
          <h2 id="questionText"></h2>
          <div class="options" id="options"></div>
        </article>
      </section>

      <section class="result hidden" id="resultScreen">
        <div class="result-top">
          <button class="ghost-btn" id="restartBtn">重测</button>
        </div>
        <article class="result-card">
          <div class="result-section result-hero">
            <div class="result-stamp">歌品判决书</div>
            <h2>最终结果</h2>
            <div class="type-stack">
              <p class="type-line"><span>主类型</span><strong id="mainType"></strong></p>
              <p class="type-line"><span>副类型</span><strong id="subType"></strong></p>
            </div>
            <p class="result-copy" id="mainCopy"></p>
            <p class="sub-copy" id="subCopy"></p>
          </div>

          <div class="result-grid">
            <div class="result-section radar-card">
              <div class="radar-head">
                <div>
                  <h3>性张力等级</h3>
                  <strong id="tensionLevel"></strong>
                </div>
                <button class="radar-combo" id="radarCombo" type="button"></button>
              </div>
              <div class="radar-wrap">
                <svg id="radarChart" viewBox="0 0 240 240" role="img" aria-label="六维雷达图"></svg>
                <div class="radar-tip" id="radarTip" aria-live="polite"></div>
              </div>
            </div>
            <div class="result-section">
              <h3>最佳伴侣</h3>
              <strong id="bestPartner"></strong>
              <p id="partnerCopy"></p>
            </div>
            <div class="result-section">
              <h3>冤家类型</h3>
              <strong id="enemyType"></strong>
              <p id="enemyCopy"></p>
            </div>
            <div class="result-section advice-card">
              <h3>情感建议</h3>
              <p id="adviceCopy"></p>
            </div>
          </div>
        </article>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
